<script>
(function () {
  "use strict";

  var STORE_ORIGIN = "https://roatanselfstorage.storeganise.com";
  var PAY_URL = "https://www.payroatanselfstorage.com";
  var ENTRY_API = PAY_URL + "/api/storeganise/reservation";
  if (window.location.origin !== STORE_ORIGIN || window.__BWP_RESERVATION_PAY_V2__) return;
  window.__BWP_RESERVATION_PAY_V2__ = true;
  var navigating = false;

  function showError(element, message) {
    var notice = document.getElementById("bwp-reservation-pay-error");
    if (!notice) {
      notice = document.createElement("p");
      notice.id = "bwp-reservation-pay-error";
      notice.setAttribute("role", "alert");
      notice.style.cssText = "color:#9f1239;font-size:14px;margin:12px 0;";
      element.parentNode.insertBefore(notice, element.nextSibling);
    }
    notice.textContent = message;
  }

  function redirectToPay(event) {
    if (event.button !== 0 || event.ctrlKey || event.metaKey || event.shiftKey || event.altKey) return;
    var node = event.target;
    if (node && node.nodeType !== 1) node = node.parentElement;
    var element = node && node.closest ? node.closest("a,button") : null;
    if (!element || element.disabled || element.getAttribute("aria-disabled") === "true") return;

    var page = new URL(window.location.href);
    var href = element.getAttribute("data-bwp-original-href") || element.getAttribute("href");
    var original = null;
    try { if (href) original = new URL(href, STORE_ORIGIN); } catch (ignore) {}
    var nativeLink = original && original.origin === STORE_ORIGIN &&
      /^\/api\/v1\/billing\/custom\/?$/.test(original.pathname);
    var text = (element.textContent || "").replace(/\s+/g, " ").trim().toLowerCase();
    var bookingBilling = /^\/sites\/[^/]+\/[^/]+\/?$/.test(page.pathname) && page.searchParams.get("step") === "billing";
    var paymentLabel = /^(añadir un método de pago|agregar un método de pago|add payment method|continuar a métodos de pago|continuar al pago|pagar)$/.test(text);
    if (!nativeLink && !(bookingBilling && paymentLabel)) return;

    event.preventDefault();
    event.stopImmediatePropagation();
    if (navigating) return;

    var pageOrder = page.searchParams.get("orderId");
    var linkOrder = nativeLink ? original.searchParams.get("orderId") : null;
    var orderId = pageOrder || linkOrder;
    if (!orderId || !/^[a-f0-9]{24}$/i.test(orderId) ||
      page.searchParams.getAll("orderId").length > 1 ||
      (nativeLink && original.searchParams.getAll("orderId").length > 1) ||
      (pageOrder && linkOrder && pageOrder !== linkOrder)) {
      showError(element, "Abra el pago desde la reserva de su bodega para identificar qué desea pagar.");
      return;
    }

    // Pay verifies the customer and obtains the total from Storeganise.
    // Do not put API keys, customer details or amounts in this tag.
    var destination = new URL(ENTRY_API);
    var returnPage = new URL(page.pathname, STORE_ORIGIN);
    ["orderId", "date", "step", "lang", "_n"].forEach(function (key) {
      if (page.searchParams.has(key)) returnPage.searchParams.set(key, page.searchParams.get(key));
    });
    returnPage.searchParams.set("orderId", orderId);
    destination.searchParams.set("orderId", orderId);
    destination.searchParams.set("returnUrl", returnPage.href);
    navigating = true;
    window.location.assign(destination.href);
  }

  window.addEventListener("click", redirectToPay, true);
  window.addEventListener("pageshow", function () { navigating = false; });
})();
</script>
